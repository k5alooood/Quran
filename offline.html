<!DOCTYPE html>

<title>غير متصل — القرآن الكريم مباشر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(230,210,150,.14);border-radius:20px;padding:40px 32px;max-width:360px;width:100%}
svg{margin:0 auto 20px;display:block;color:#d4af37}
h1{font-family:'Amiri',serif;font-size:1.5rem;color:#d4af37;margin-bottom:10px}
p{font-size:.9rem;color:rgba(244,240,230,.68);line-height:1.7;margin-bottom:24px}
a{display:inline-block;padding:10px 24px;border-radius:999px;background:linear-gradient(135deg,#d4af37,#e6c76a);color:#08211c;font-weight:700;text-decoration:none;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
    <path d="M1 6s4-2 11-2 11 2 11 2"/><path d="M1 6v12l11 4 11-4V6"/><line x1="12" y1="6" x2="12" y2="22"/>
    <line x1="4" y1="9" x2="4" y2="13"/><line x1="20" y1="9" x2="20" y2="13"/>
  </svg>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تعذّر تحميل القرآن الكريم مباشر.<br>تحقق من اتصالك بالإنترنت وأعد المحاولة.</p>
