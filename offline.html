<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>غير متصل — القرآن الكريم مباشر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0e0d0a;--card:rgba(255,255,255,.05);--border:rgba(230,210,150,.14);--gold:#d4af37;--gold-2:#e6c76a;--text:#f4f0e6;--muted:rgba(244,240,230,.68);--btn-text:#1a1405}
html[data-theme="light"]{--bg:#f0f1ee;--card:#fff;--border:rgba(122,90,22,.14);--gold:#7a5a16;--gold-2:#8f681a;--text:#1b1a16;--muted:rgba(27,26,22,.66);--btn-text:#fffaf0}
html,body{height:100%;overflow:hidden;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);direction:rtl}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 32px;max-width:360px;width:100%}
svg{margin:0 auto 20px;display:block;color:var(--gold)}
h1{font-family:'Amiri','Georgia',serif;font-size:1.5rem;color:var(--gold);margin-bottom:10px}
p{font-size:.9rem;color:var(--muted);line-height:1.7;margin-bottom:24px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 28px;border-radius:999px;background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--btn-text);font-weight:700;text-decoration:none;font-size:1rem}
</style>
<script>
(function(){try{var m=localStorage.getItem('qr_theme_mode'),t=localStorage.getItem('qr_theme');var manual=(m==='manual')||(m!=='system'&&t);var v=manual&&(t==='light'||t==='dark')?t:(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',v);}catch(e){}})(); /* نفس منطق التطبيق: يدوي ← المحفوظ، وإلا ← نظام الجهاز */
</script>
</head>
<body>
<div class="card">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
    <path d="M1 6s4-2 11-2 11 2 11 2"/><path d="M1 6v12l11 4 11-4V6"/><line x1="12" y1="6" x2="12" y2="22"/>
    <line x1="4" y1="9" x2="4" y2="13"/><line x1="20" y1="9" x2="20" y2="13"/>
  </svg>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تعذّر تحميل القرآن الكريم مباشر.<br>تحقق من اتصالك بالإنترنت وأعد المحاولة.</p>
  <a href="./">إعادة المحاولة</a>
</div>
</body>
</html>
